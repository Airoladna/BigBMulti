<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#1c2340"><title>Mein Tamagotchi 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#1c2340;font-family:system-ui,sans-serif;color:#fff}
#app{position:relative;width:min(100vw,460px);padding:12px;background:linear-gradient(160deg,#e6cb54,#c9a92f);border-radius:44px;box-shadow:0 10px 40px #0008,inset 0 -6px 0 #0003}
#hd{display:flex;justify-content:space-between;align-items:center;padding:2px 10px 8px;color:#2d3a73;font-weight:700;font-size:14px}
#hd button{background:none;border:0;font-size:20px;cursor:pointer;color:#2d3a73}#hd #gb{font-size:12px;font-weight:700;background:#0002;border-radius:10px;padding:4px 8px;margin-left:6px}
#scr{background:#2d3a73;padding:8px;border-radius:26px;border:4px solid #232e5e}
#bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px;font-size:13px;text-align:center}
.bar{height:8px;background:#0006;border-radius:4px;overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;width:50%;transition:width .5s,background .5s}
#sc{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:16px;background:#2a2a40;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,#0007)}
#bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#222;padding:6px 10px;border-radius:14px;font-size:13px;font-weight:600;max-width:70%;text-align:center;display:none;pointer-events:none;box-shadow:0 2px 6px #0004;z-index:2}
#bub:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
#hud{position:absolute;top:8px;left:12px;font-weight:800;font-size:16px;text-shadow:0 2px 4px #000;display:none;z-index:2;pointer-events:none}
.pt{position:absolute;font-size:26px;pointer-events:none;animation:fl 1.4s forwards;z-index:2}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
#btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
#btns button,#menu button,#ov button{background:linear-gradient(#f6dc6a,#d8b83a);border:0;border-bottom:4px solid #a88a1e;border-radius:14px;padding:9px 2px;font-size:13px;font-weight:700;color:#2d3a73;cursor:pointer}
#btns button:active,#menu button:active,#ov button:active{transform:translateY(2px);border-bottom-width:2px}
#btns span{display:block;font-size:22px}
#menu{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
#ov{position:absolute;inset:0;background:#0009;border-radius:44px;display:none;align-items:center;justify-content:center;z-index:9;text-align:center}
#ov>div{background:#2d3a73;border:4px solid #e6cb54;border-radius:22px;padding:20px;width:84%}
#ov input{font-size:18px;padding:8px;border-radius:10px;border:0;text-align:center;width:80%;margin:8px 0 14px}
#ov button{padding:10px 22px;font-size:16px}#ov h2{margin:0 0 8px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"}}</script>
</head><body>
<div id="app">
<div id="hd"><span id="info">…</span><button id="sb" onclick="snd=!snd;this.textContent=snd?'🔊':'🔇'">🔊</button></div>
<div id="scr"><div id="bars"></div>
<div id="sc"><canvas id="gl"></canvas><div id="vig"></div><div id="bub"></div><div id="hud"></div></div>
<div id="menu"><button onclick="feed('apple')">🍎<br>Apfel</button><button onclick="feed('burger')">🍔<br>Burger</button><button onclick="feed('cake')">🍰<br>Kuchen</button></div>
<div id="btns"><button onclick="menu()"><span>🍽️</span>Essen</button><button onclick="game()"><span>🎮</span>Spielen</button><button onclick="slp()"><span>💡</span>Schlafen</button><button onclick="wash()"><span>🚿</span>Waschen</button><button onclick="med()"><span>💊</span>Medizin</button><button onclick="pet()"><span>❤️</span>Streicheln</button></div></div>
<div id="ov"></div>
</div>

<script>
/* ===== Spiellogik ===== */
const $=s=>document.querySelector(s),KEY='tama3d_v1',cl=v=>Math.max(0,Math.min(100,v));
let S,snd=true,x=50,tx=50,dir=0,walk=false,nW=0,eatU=0,waveU=0,jumpU=0,busy=false,msgU=0,lastM=0,cls='',mood='',B=[],ac,G=null,foodK='apple',pc=0;
const def=()=>({name:'Tama',born:Date.now(),food:80,fun:80,en:90,hy:90,hp:100,sick:false,sleep:false,poop:[],dead:false,last:Date.now(),games:0});
const save=()=>{try{localStorage[KEY]=JSON.stringify(S)}catch(e){}};
function beep(f=440,d=.1,t='square',v=.04){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(1e-4,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const jingle=a=>a.forEach((f,i)=>setTimeout(()=>beep(f,.12),i*110));
function ov(h){const o=$('#ov');o.innerHTML='<div>'+h+'</div>';o.style.display='flex'}const ovc=()=>$('#ov').style.display='none';
function say(t,ms=2800){const b=$('#bub');b.textContent=t;b.style.display='block';msgU=Date.now()+ms}
function pt(e,px=x,py=45){const s=document.createElement('span');s.className='pt';s.textContent=e;s.style.left=px+'%';s.style.top=(100-py)+'%';$('#sc').appendChild(s);setTimeout(()=>s.remove(),1400)}
const stage=()=>{const h=(Date.now()-S.born)/36e5;return h<.17?['Baby',.62]:h<1?['Kind',.78]:h<6?['Teenie',.9]:['Erwachsen',1]};
function age(){const m=(Date.now()-S.born)/6e4;return m<60?Math.floor(m)+' Min':m<2880?Math.floor(m/60)+' Std':Math.floor(m/1440)+' Tage'}
function newGame(){S=def();S.pending=true;ov('<h2>🥚 Neues Tamagotchi</h2><p>Wie soll es heißen?</p><input id="nm" maxlength="12" value="Tama"><br><button onclick="start()">Los geht\'s!</button>')}
function start(){S.name=$('#nm').value.trim()||'Tama';S.born=S.last=Date.now();delete S.pending;ovc();save();jingle([523,659,784]);say('Hallo! Ich bin '+S.name+'! 👋',3500);waveU=Date.now()+3000;ui()}
function die(){S.dead=true;save();$('#bub').style.display='none';beep(150,.8,'sawtooth');ov(`<h2>💀 ${S.name} ist gestorben</h2><p>Alter: ${age()}<br>Pass beim nächsten Mal besser auf!</p><button onclick="newGame()">🥚 Neues Tamagotchi</button>`)}
function step(dt,off){const k=off?.35:1,m=dt/60;
if(S.sleep){S.food-=m*k;S.fun-=.5*m*k;S.en+=8*m;S.hy-=.3*m*k}else{S.food-=3*m*k;S.fun-=2.5*m*k;S.en-=1.5*m*k;S.hy-=1.2*m*k}
if(S.sick){S.hp-=3*m*k;S.fun-=3*m*k}
if(S.food<=0||S.hy<=0||S.en<=0)S.hp-=2*m*k;else if(!S.sick&&S.food>50&&S.fun>40&&S.hy>50)S.hp+=1.5*m;
if(S.fun<=0)S.hp-=m*k;
['food','fun','en','hy','hp'].forEach(a=>S[a]=cl(S[a]));
if(S.sleep&&S.en>=100){S.sleep=false;say('Guten Morgen! ☀️')}
if(!S.sick&&Math.random()<((S.hy<25||S.poop.length>=3)?.1:.003)*m*k){S.sick=true;say('Mir ist schlecht... 🤒');beep(200,.4,'sawtooth')}
if(!S.sleep&&S.food>30&&S.poop.length<4&&Math.random()<.25*m){S.poop.push(10+Math.random()*80|0)}
if(S.hp<=0){if(off)S.hp=15;else die()}}
function tick(){if(!S||S.pending||S.dead)return;const n=Date.now(),dt=Math.min((n-S.last)/1000,21600);S.last=n;if(dt<=0)return;step(dt,dt>5);if(S.dead)return;ui();
if(n-lastM>11000&&!S.sleep&&!G&&Date.now()>msgU){lastM=n;auto()}if(Math.floor(n/1000)%3==0)save()}
function auto(){const t=S.sick?'Mir ist übel... 🤒':S.food<30?'Ich habe Hunger! 🍔':S.hy<30?'Ich stinke... 🚿':S.poop.length>=2?'Hier liegt ein Haufen! 💩':S.en<25?'Ich bin müde... 😴':S.fun<30?'Mir ist langweilig! 🎮':['Hallo! 👋','Mir geht\'s toll! 😄','Spiel mit mir!','Schönes Wetter heute ☀️'][Math.random()*4|0];say(t);if(t.includes('Hallo'))waveU=Date.now()+2500}
function ui(){const v=[S.food,S.fun,S.en,S.hy,S.hp];B.forEach((b,i)=>{b.style.width=v[i]+'%';b.style.background=v[i]>50?'#5c5':v[i]>25?'#fa3':'#e44'});$('#info').textContent=`${S.name} · ${stage()[0]} · ${age()}`}
function clean(i){S.poop.splice(i,1);S.hy=cl(S.hy+5);beep(800,.08);pt('✨',x+5)}
function menu(){if(!ok())return;const m=$('#menu');m.style.display=m.style.display=='grid'?'none':'grid'}
function ok(){if(!S||S.dead||S.pending||busy)return false;if(S.sleep){say('Zzz... lass mich schlafen 😴');return false}return true}
const FD={apple:{f:15,fun:2,hy:0,hp:0},burger:{f:35,fun:6,hy:-4,hp:0},cake:{f:20,fun:18,hy:-2,hp:-2}};
function feed(t){if(!ok())return;$('#menu').style.display='none';const d=FD[t];if(S.food>=97){say('Ich bin satt! 🤢');return}
S.food=cl(S.food+d.f);S.fun=cl(S.fun+d.fun);S.hy=cl(S.hy+d.hy);S.hp=cl(S.hp+d.hp);foodK=t;eatU=Date.now()+2600;
[0,300,600,900,1200].forEach(t=>setTimeout(()=>beep(300+t/3,.08),t));setTimeout(()=>{say('Lecker! 😋');pt('😋')},2600);ui()}
function slp(){if(!S||S.dead||S.pending||busy)return;$('#menu').style.display='none';if(!S.sleep&&S.en>=95){say('Ich bin gar nicht müde!');return}S.sleep=!S.sleep;if(S.sleep){jingle([392,330,262]);say('Ab ins Bett... 🛏️')}else{say('Gähn... ☀️');jingle([262,330,392])}ui()}
function wash(){if(!ok())return;S.hy=100;S.poop=[];S.fun=cl(S.fun-3);for(let i=0;i<6;i++)setTimeout(()=>pt('🫧',x-12+Math.random()*24,20+Math.random()*30),i*150);jingle([700,900,1100]);jumpU=Date.now()+600;say('Sauber! ✨');ui()}
function med(){if(!ok())return;if(S.sick){S.sick=false;S.hp=cl(S.hp+15);pt('💊');jingle([523,659,784,1046]);say('Mir geht\'s besser! 💪')}else{S.hp=cl(S.hp-5);say('Ich bin doch gar nicht krank! 😖');beep(200,.3)}ui()}
function pet(){if(!S||S.dead||S.pending||busy)return;if(S.sleep){say('Zzz...');return}if(Date.now()<pc)return;pc=Date.now()+800;S.fun=cl(S.fun+6);waveU=Date.now()+2200;jumpU=Date.now()+600;for(let i=0;i<3;i++)setTimeout(()=>pt('❤️',x-8+Math.random()*16,50+Math.random()*15),i*180);beep(880,.1);if(S.sick)say('Danke... 🥺');else say('Hihi! 😄');ui()}
/* Minispiel: Äpfel fangen (3D-Items werden im Modul gerendert) */
function game(){if(!ok())return;if(S.sick){say('Mir ist zu schlecht... 🤒');return}if(S.en<15){say('Ich bin zu müde! 😴');return}$('#menu').style.display='none';busy=true;tx=x;G={sc:0,tl:25,sp:0,its:[]};$('#hud').style.display='block';jingle([392,523,659])}
function gstep(d){G.tl-=d;G.sp-=d;if(G.sp<=0){G.sp=.6;const r=Math.random();G.its.push({x:10+Math.random()*80,y:100,v:35+Math.random()*25+(25-G.tl)*1.5,e:r<.12?'⭐':r<.3?'💩':'🍎'})}
const dx=tx-x;x+=dx*.3;if(Math.abs(dx)>.8)dir=Math.sign(dx);walk=Math.abs(dx)>1.2;
G.its.forEach(i=>{i.y-=i.v*d;if(i.y<34&&i.y>12&&Math.abs(i.x-x)<10){i.d=1;if(i.e=='🍎'){G.sc++;beep(700,.06);pt('+1',x)}else if(i.e=='⭐'){G.sc+=3;beep(1000,.1);pt('⭐+3',x)}else{G.sc=Math.max(0,G.sc-2);beep(150,.15,'sawtooth');pt('💩-2',x)}}});
G.its=G.its.filter(i=>!i.d&&i.y>0);$('#hud').textContent=`Punkte: ${G.sc} · ⏱ ${Math.max(0,Math.ceil(G.tl))}s`;if(G.tl<=0)gend()}
function gend(){const sc=G.sc;S.fun=cl(S.fun+8+sc*2);S.en=cl(S.en-12);S.food=cl(S.food-6);S.games++;G=null;busy=false;$('#hud').style.display='none';jingle([523,659,784,1046]);
say(`${sc} Punkte! `+(sc>12?'Mega! 🤩':sc>5?'Das hat Spaß gemacht! 😄':'Naja... 😅'),3500);waveU=Date.now()+2500;jumpU=Date.now()+600;ui()}
addEventListener('keydown',e=>{if(G){if(e.key=='ArrowLeft')tx=Math.max(8,tx-7);if(e.key=='ArrowRight')tx=Math.min(92,tx+7)}});
/* Bewegung & Pose (Zustand, den das 3D-Modul liest) */
function fr(){if(!S||S.pending)return;const t=Date.now();
if(!busy&&!S.dead&&t>eatU&&(!S.sleep||Math.abs(x-78)>2)){const sp=S.sick?.12:S.food<20?.2:.4,tg=S.sleep?78:tx,d=tg-x;if(Math.abs(d)>1){x+=Math.sign(d)*sp;dir=Math.sign(d);walk=true}else{walk=false;if(!S.sleep&&t>nW){tx=14+Math.random()*72;nW=t+2500+Math.random()*5000}}}else if(!G)walk=false;
if(G)gstep(.05);
const c=[];if(S.sleep&&!walk)c.push('sleep');else{if(walk)c.push('walk');else if(t<waveU)c.push('wave');if(t<jumpU)c.push('jump');if(t<eatU)c.push('eat')}if(S.sick)c.push('sick');if(S.hy<30)c.push('dirty');cls=c.join(' ');
const mn=Math.min(S.food,S.fun,S.hy,S.en);mood=(t<eatU||G)?'happy':S.sleep?'neutral':(S.sick||mn<25)?'sad':(S.food+S.fun+S.hy+S.en>260)?'happy':'neutral'}
/* Start */
['🍖','😊','⚡','🧼','❤️'].forEach(e=>{const d=document.createElement('div');d.innerHTML=e+'<div class="bar"><i></i></div>';$('#bars').appendChild(d);B.push(d.querySelector('i'))});
try{S=JSON.parse(localStorage[KEY])}catch(e){}
if(!S||S.pending)newGame();else if(S.dead){ov(`<h2>💀 ${S.name} ist gestorben</h2><p>Alter: ${age()}</p><button onclick="newGame()">🥚 Neues Tamagotchi</button>`)}else{tick();say('Willkommen zurück! 👋',3500);waveU=Date.now()+3000}
setInterval(tick,1000);setInterval(fr,50);document.addEventListener('visibilitychange',()=>{document.hidden?save():tick()});addEventListener('beforeunload',save);
</script>

<script type="module">
/* ===== 3D-Welt (Three.js: PBR, weiche Schatten, Bloom, ACES-Tonemapping) ===== */
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const V=THREE.Vector3,PI=Math.PI,host=$('#sc'),cv=$('#gl');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.NeutralToneMapping;
const sg=new THREE.Scene();sg.background=new THREE.Color(0x2a2a40);
sg.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),.04).texture;sg.environmentIntensity=.35;
const cam=new THREE.PerspectiveCamera(34,1,.1,60);cam.position.set(0,2.5,11.8);
const comp=new EffectComposer(R,new THREE.WebGLRenderTarget(2,2,{type:THREE.HalfFloatType,samples:4}));
comp.addPass(new RenderPass(sg,cam));const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.06,.5,1.0);comp.addPass(bloom);comp.addPass(new OutputPass());
function rs(){const w=host.clientWidth,h=host.clientHeight;if(!w)return;R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(w,h,false);comp.setPixelRatio(R.getPixelRatio());comp.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs);new ResizeObserver(rs).observe(host);

/* Helfer */
function ctex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;if(rep)t.repeat.set(...rep);return t}
const P=(c,o={})=>new THREE.MeshPhysicalMaterial({color:c,roughness:.9,...o});
const noise=ctex(128,128,(g,w,h)=>{const d=g.createImageData(w,h);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=128+Math.random()*127|0;d.data[i+3]=255}g.putImageData(d,0,0)},[6,4]);
const fab=(c,o={})=>P(c,{sheen:1,sheenRoughness:.7,sheenColor:new THREE.Color(c).multiplyScalar(1.8),bumpMap:noise,bumpScale:.35,...o});
const sph=(w=32,h=24,...a)=>new THREE.SphereGeometry(1,w,h,...a);
function mesh(g,m,p=[0,0,0],s=[1,1,1],par,cast=true){const o=new THREE.Mesh(g,m);o.position.set(...p);o.scale.set(...s);o.castShadow=cast;o.receiveShadow=true;par.add(o);return o}
function limb(a,b,r,m,par){const A=new V(...a),Bv=new V(...b),d=Bv.clone().sub(A),o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),m);o.position.copy(A).add(Bv).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new V(0,1,0),d.normalize());o.castShadow=true;par.add(o);return o}
function rr(w,h,r){const s=new THREE.Shape(),a=-w/2,b=-h/2;s.moveTo(a+r,b);s.lineTo(a+w-r,b);s.quadraticCurveTo(a+w,b,a+w,b+r);s.lineTo(a+w,b+h-r);s.quadraticCurveTo(a+w,b+h,a+w-r,b+h);s.lineTo(a+r,b+h);s.quadraticCurveTo(a,b+h,a,b+h-r);s.lineTo(a,b+r);s.quadraticCurveTo(a,b,a+r,b);return s}
function emo(e,s){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.font='100px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,64,70);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));sp.scale.set(s,s,s);return sp}

/* Licht */
const hemi=new THREE.HemisphereLight(0xdcecff,0xb99a70,.8);sg.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,2.6);sun.position.set(-4,8,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:30});sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;sg.add(sun);
const rim=new THREE.DirectionalLight(0x9db8ff,1.2);rim.position.set(5,5,-4);sg.add(rim);
const lamp=new THREE.PointLight(0xffc27a,0,10,1.6);lamp.position.set(-.95,2.1,-1.5);sg.add(lamp);

/* Zimmer */
const floorT=ctex(512,512,(g,w,h)=>{for(let i=0;i<8;i++){const y=i*h/8;g.fillStyle=`hsl(30,${40+Math.random()*10}%,${52+Math.random()*8}%)`;g.fillRect(0,y,w,h/8);for(let k=0;k<30;k++){g.strokeStyle='rgba(90,50,20,.12)';g.beginPath();const yy=y+Math.random()*h/8;g.moveTo(0,yy);g.lineTo(w,yy+Math.random()*3);g.stroke()}g.fillStyle='rgba(60,30,10,.5)';g.fillRect(0,y,w,2);g.fillRect(Math.random()*w,y,2,h/8)}},[4,3]);
const wallT=ctex(256,256,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=i%2?'#d7ebef':'#bdd8de';g.fillRect(i*w/8,0,w/8,h)}g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<40;i++)g.fillRect(Math.random()*w,Math.random()*h,2,2)},[6,2]);

const pms=[],im=new Map(),ray=new THREE.Raycaster(),mv=new THREE.Vector2(),fl=new THREE.Plane(new V(0,1,0),0),hit=new V();
const flies=new THREE.Group();for(let i=0;i<3;i++)mesh(sph(8,6),dark,[0,0,0],[.04,.04,.04],flies,false);sg.add(flies);
const zz=emo('💤',.9);zz.visible=false;sg.add(zz);
/* Eingabe */

const toPct=()=>{ray.ray.intersectPlane(fl,hit);return Math.max(8,Math.min(92,50+hit.x/.065))};
cv.addEventListener('pointerdown',e=>{if(!S||S.pending||S.dead)return;pick(e);$('#menu').style.display='none';
if(G){tx=toPct();return}if(busy)return;
const ph=ray.intersectObjects(pms,true)[0];if(ph){let o=ph.object;while(o&&o.userData.i===undefined)o=o.parent;if(o)clean(o.userData.i);return}
if(ray.intersectObject(root,true).length){pet();return}if(!S.sleep){tx=toPct();nW=Date.now()+5000}});
cv.addEventListener('pointermove',e=>{if(G&&(e.buttons||e.pointerType=='mouse')){pick(e);tx=toPct()}});
/* Zustand */
const cur={};let dt=.016,ph0=0,nb=2,bl=0,last=performance.now()/1e3,hs={x:50,y:30};const v1=new V();
const L=(k,v,r=10)=>{cur[k]=cur[k]===undefined?v:cur[k]+(v-cur[k])*Math.min(1,r*dt);return cur[k]};
window.pt=(e,px=x,py=45)=>{const s=document.createElement('span');s.className='pt';s.textContent=e;s.style.left=Math.max(6,Math.min(94,hs.x+(px-x)*.9))+'%';s.style.top=(hs.y-(py-45)*.6)+'%';host.appendChild(s);setTimeout(()=>s.remove(),1400)};
function update(t){
if(!S)return;const c=cls,dead=S.dead,sl=c.includes('sleep'),wk=c.includes('walk'),wv=c.includes('wave'),jp=c.includes('jump'),ea=c.includes('eat'),sk=S.sick,gm=!!G,sad=(mood=='sad'||sk),sc=stage()[1];
root.visible=!dead;tomb.visible=dead;ghost.visible=dead;
const wx=(x-50)*.065;if(dead){tomb.position.set(wx,0,0);ghost.position.set(wx,2.6+Math.sin(t*2)*.2,0)}
/* Root */
let X=wx,Y=0,ry=0,rz=0,Z=0;
if(sl){X=3.7*sc-.4;Y=.8+.62*sc;rz=PI/2;Z=-1}else if(wk)ry=dir>0?.5:-.5;
if(jp){const p=1-Math.max(0,jumpU-Date.now())/600;Y+=Math.sin(PI*Math.min(1,p))*.9}
root.position.set(L('px',X,sl?4:14),L('py',Y,jp?30:8),L('pz',Z,6));root.rotation.y=L('ry',ry,8);root.rotation.z=L('rz',rz,5);root.scale.setScalar(L('sc',sc,3)*.95);
sh.visible=!sl;
/* Gehzyklus */
if(wk)ph0+=dt*(sk?6:9);const sw=wk?Math.sin(ph0):0;
legL.rotation.z=L('ll',sw*.32,25);legR.rotation.z=L('lr',-sw*.32,25);
rig.position.y=L('bob',wk?Math.abs(Math.sin(ph0))*.1:Math.sin(t*2)*.012,20);rig.rotation.z=L('lean',wk?sw*.025:0,10);
bd.scale.set(1+Math.sin(t*2)*.006,1+Math.sin(t*2)*.01,1);
/* Arme */
let rl=wk?-sw*.14:0,rr=0;
if(wv&&!wk)rr=-.18+Math.sin(t*10)*.2;else if(jp){rr=.9;rl=-.9}else if(gm){rr=.5;rl=-.5}else if(wk)rr=sw*.14;
if(ea)rr=.35+Math.sin(t*12)*.05;
armL.rotation.z=L('al',rl,12);armR.rotation.z=L('ar',rr,wv?30:12);
/* Kopf */
hd.rotation.z=L('hrz',sl?.12:sad?-.07:Math.sin(t*.9)*.015+(wk?sw*.02:0),5);hd.position.y=ly(600)+L('hy',ea?Math.sin(t*14)*.025:0,20);
/* Augen & Mund */
if(t>nb){bl=t+.13;nb=t+2+Math.random()*3}const closed=t<bl||sl||dead,lc=L('lid',closed?1:0,30);
lids.forEach(l=>{l.scale.y=Math.max(.001,lc);l.visible=lc>.04});
mouth(ea?'eat':sl?'closed':sad?'sad':'open',ea?.5+.5*Math.sin(t*16):0);
const tint=new THREE.Color(sk?0xc9e3a0:0xffffff).multiplyScalar(.55+.45*(cur.dim===undefined?1:cur.dim));mats.forEach(m=>m.color.lerp(tint,Math.min(1,4*dt)));

Object.entries(foods).forEach(([k,f])=>f.visible=ea&&k==foodK);if(ea){const p=1-Math.max(0,eatU-Date.now())/2600;hand.scale.setScalar(.8*(1-.75*p));hand.position.y=ly(560)+.05}
/* Fliegen, Zzz */

flies.visible=S.hy<30&&!dead;if(flies.visible)flies.children.forEach((f,i)=>f.position.set(hp3.x+Math.cos(t*5+i*2.1)*.9,hp3.y-.4+Math.sin(t*7+i)*.2,hp3.z+Math.sin(t*5+i*2.1)*.9));
zz.visible=sl&&!dead;if(zz.visible){const p=(t%2.5)/2.5;zz.position.set(hp3.x+.8+p*.5,hp3.y+p*1.1,hp3.z+.6);zz.material.opacity=1-p;zz.scale.setScalar(.5+p*.7)}

sky.color.set(night?0x16224d:0x9fd8ff);sun.color.set(night?0x9db8ff:0xfff0d8);bloom.strength=.05+(1-dim)*.2;R.toneMappingExposure=.95;

for(const[k,m]of im)if(!G||!G.its.includes(k)){sg.remove(m);im.delete(k)}

b.style.left=Math.max(24,Math.min(76,hs.x))+'%';b.style.top=Math.max(14,hs.y)+'%';if(dead||Date.now()>msgU)b.style.display='none'}
